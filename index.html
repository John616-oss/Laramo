<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Laramo | Programmer & IT Student Learning Platform</title>
    <meta name="description" content="Master coding from Python to C++, interactive DSA practice, VS Code workflows, and Git/GitHub version control with offline support and cloud sync." />
    <meta property="og:title" content="Laramo | Programmer & IT Student Learning Platform" />
    <meta property="og:description" content="Interactive learning platform for programmers and IT students with coding challenges, DSA visualizer, VS Code integration, and Git simulator." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        var theme = localStorage.getItem('laramo_theme');
        if (theme === 'light') {
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
